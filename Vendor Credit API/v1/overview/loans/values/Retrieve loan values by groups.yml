info:
  name: Retrieve loan values by groups
  type: http
  seq: 1
  tags:
    - Overview

http:
  method: GET
  url: "{{baseUrl}}/v1/overview/loans/values"
  params:
    - name: grouping
      value: Monthly
      type: query
    - name: grouping
      value: Weekly
      type: query
      disabled: true
    - name: grouping
      value: Daily
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
