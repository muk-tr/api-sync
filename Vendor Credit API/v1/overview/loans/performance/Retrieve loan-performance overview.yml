info:
  name: Retrieve loan-performance overview
  type: http
  seq: 1
  tags:
    - Overview

http:
  method: GET
  url: "{{baseUrl}}/v1/overview/loans/performance?StartAt=2026-05-01&EndAt=2026-06-01"
  params:
    - name: StartAt
      value: 2026-05-01
      type: query
    - name: EndAt
      value: 2026-06-01
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
