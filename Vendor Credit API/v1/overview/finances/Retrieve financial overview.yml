info:
  name: Retrieve financial overview
  type: http
  seq: 1
  tags:
    - Overview

http:
  method: GET
  url: "{{baseUrl}}/v1/overview/finances?startAt=2026-05-15&endAt=2026-05-21"
  params:
    - name: startAt
      value: 2026-05-15
      type: query
    - name: endAt
      value: 2026-05-21
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
