info:
  name: Reverse a disbursement
  type: http
  seq: 1
  tags:
    - Loans

http:
  method: POST
  url: "{{baseUrl}}/v1/loans/:loanId/reverse-disbursement"
  params:
    - name: loanId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "amount": 0,
        "transactionReference": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
