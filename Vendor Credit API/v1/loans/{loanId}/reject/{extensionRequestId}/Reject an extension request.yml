info:
  name: Reject an extension request
  type: http
  seq: 1
  tags:
    - Loans

http:
  method: POST
  url: "{{baseUrl}}/v1/loans/:loanId/reject/:extensionRequestId"
  params:
    - name: loanId
      value: ""
      type: path
    - name: extensionRequestId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "reason": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
