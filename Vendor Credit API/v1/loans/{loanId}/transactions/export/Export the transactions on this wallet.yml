info:
  name: Export the transactions on this wallet
  type: http
  seq: 1
  tags:
    - Loans

http:
  method: GET
  url: "{{baseUrl}}/v1/loans/:loanId/transactions/export"
  params:
    - name: loanId
      value: ""
      type: path
    - name: Format
      value: Pdf
      type: query
      disabled: true
    - name: Format
      value: Excel
      type: query
      disabled: true
    - name: Search
      value: ""
      type: query
      disabled: true
    - name: StartAt
      value: ""
      type: query
      disabled: true
    - name: EndAt
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
