info:
  name: Send a loan extension request to the CFO for review
  type: http
  seq: 1
  tags:
    - Loans

http:
  method: POST
  url: "{{baseUrl}}/v1/loans/:loanId/send-to-cfo/:extensionRequestId"
  params:
    - name: loanId
      value: ""
      type: path
    - name: extensionRequestId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
