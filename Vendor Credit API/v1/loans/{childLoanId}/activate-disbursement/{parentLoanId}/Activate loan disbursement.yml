info:
  name: Activate loan disbursement
  type: http
  seq: 1
  tags:
    - Loans

http:
  method: POST
  url: "{{baseUrl}}/v1/loans/:childLoanId/activate-disbursement/:parentLoanId"
  params:
    - name: childLoanId
      value: ""
      type: path
    - name: parentLoanId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
