info:
  name: Retrieve all groups of businesses with similar names
  type: http
  seq: 1
  tags:
    - Compliance

http:
  method: GET
  url: "{{baseUrl}}/v1/compliance/similar-businesses"
  params:
    - name: similarityThreshold
      value: "85"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
