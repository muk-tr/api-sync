info:
  name: Retroactively flag existing AwaitingVerification businesses that have similar names. Safe to run multiple times — already-reviewed businesses are excluded.
  type: http
  seq: 1
  tags:
    - Compliance

http:
  method: POST
  url: "{{baseUrl}}/v1/compliance/seed-similarity-flags"
  params:
    - name: similarityThreshold
      value: "85"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
