info:
  name: Regenerate an Integration Partner's secret key
  type: http
  seq: 1
  tags:
    - IntegrationPartners

http:
  method: POST
  url: "{{baseUrl}}/v1/integration-partners/:partnerId/regenerate-secret"
  params:
    - name: partnerId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
