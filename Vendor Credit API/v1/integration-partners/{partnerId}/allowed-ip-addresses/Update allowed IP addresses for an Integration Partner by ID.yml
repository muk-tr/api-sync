info:
  name: Update allowed IP addresses for an Integration Partner by ID
  type: http
  seq: 1
  tags:
    - IntegrationPartners

http:
  method: PUT
  url: "{{baseUrl}}/v1/integration-partners/:partnerId/allowed-ip-addresses"
  params:
    - name: partnerId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "allowedIpAddresses": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
