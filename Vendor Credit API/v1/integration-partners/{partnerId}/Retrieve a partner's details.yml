info:
  name: Retrieve a partner's details
  type: http
  seq: 1
  tags:
    - IntegrationPartners

http:
  method: GET
  url: "{{baseUrl}}/v1/integration-partners/:partnerId"
  params:
    - name: partnerId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
