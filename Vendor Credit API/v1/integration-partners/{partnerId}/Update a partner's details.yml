info:
  name: Update a partner's details
  type: http
  seq: 2
  tags:
    - IntegrationPartners

http:
  method: PUT
  url: "{{baseUrl}}/v1/integration-partners/:partnerId"
  params:
    - name: partnerId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "contactFullName": "",
        "contactEmailAddress": "",
        "contactPhoneNumber": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
