info:
  name: Create a new Integration Partner account
  type: http
  seq: 2
  tags:
    - IntegrationPartners

http:
  method: POST
  url: "{{baseUrl}}/v1/integration-partners"
  body:
    type: json
    data: |-
      {
        "name": "",
        "contactFullName": "",
        "contactEmailAddress": "",
        "contactPhoneNumber": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
