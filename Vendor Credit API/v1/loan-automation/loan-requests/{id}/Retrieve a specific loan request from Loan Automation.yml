info:
  name: Retrieve a specific loan request from Loan Automation
  type: http
  seq: 1
  tags:
    - LoanRequests

http:
  method: GET
  url: "{{baseUrl}}/v1/loan-automation/loan-requests/:id"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
