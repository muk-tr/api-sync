info:
  name: Create a new loan request in the Loan Automation system
  type: http
  seq: 1
  tags:
    - LoanRequests

http:
  method: POST
  url: "{{baseUrl}}/v1/loan-automation/loan-requests"
  body:
    type: json
    data: |-
      {
        "externalId": "",
        "source": "VcPortal",
        "loanProductId": 0,
        "creditPolicyUserInputs": [
          {
            "slug": "",
            "value": ""
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
