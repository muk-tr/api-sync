info:
  name: Retrieve all loan requests from Loan Automation
  type: http
  seq: 2
  tags:
    - LoanRequests

http:
  method: GET
  url: "{{baseUrl}}/v1/loan-automation/loan-requests"
  params:
    - name: page
      value: "1"
      type: query
    - name: itemPerPage
      value: "10"
      type: query
    - name: search
      value: ""
      type: query
      disabled: true
    - name: sortBy
      value: ""
      type: query
      disabled: true
    - name: orderBy
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
