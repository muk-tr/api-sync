info:
  name: Create a new rate guide. Only one can exist in review.
  type: http
  seq: 1
  tags:
    - Investments

http:
  method: POST
  url: "{{baseUrl}}/v1/investments/rate-guide"
  body:
    type: json
    data: |-
      {
        "additionalComments": "",
        "rates": [
          {
            "currency": "NGN",
            "lowerBound": 0,
            "upperBound": 0,
            "call": 0,
            "thirtyDays": 0,
            "sixtyDays": 0,
            "ninetyDays": 0,
            "oneEightyDays": 0,
            "twoSeventyDays": 0,
            "threeSixtyFiveDays": 0
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
