info:
  name: Change investment terms
  type: http
  seq: 1
  tags:
    - Investments

http:
  method: PUT
  url: "{{baseUrl}}/v1/investments/:investmentId/change-terms"
  params:
    - name: investmentId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "investmentAmount": 0,
        "payoutFrequency": "AtMaturity",
        "tenorInDays": 0,
        "interestRate": 0,
        "applyWithholdingTax": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
