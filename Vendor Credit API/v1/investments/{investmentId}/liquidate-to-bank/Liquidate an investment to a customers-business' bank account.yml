info:
  name: Liquidate an investment to a customers/business' bank account
  type: http
  seq: 1
  tags:
    - Investments

http:
  method: POST
  url: "{{baseUrl}}/v1/investments/:investmentId/liquidate-to-bank"
  params:
    - name: investmentId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "principalAmount": 0,
        "interestAmount": 0,
        "bankName": "",
        "accountName": "",
        "accountNumber": "",
        "transactionReference": "",
        "description": "",
        "waivePenalty": false,
        "applyWithholdingTax": false,
        "applyCallRate": false,
        "callRate": 0,
        "liquidatedAt": "",
        "payoutCurrency": "NGN",
        "exchangeRate": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
