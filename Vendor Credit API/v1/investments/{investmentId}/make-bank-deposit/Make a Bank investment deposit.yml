info:
  name: Make a Bank investment deposit
  type: http
  seq: 1
  tags:
    - Investments

http:
  method: POST
  url: "{{baseUrl}}/v1/investments/:investmentId/make-bank-deposit"
  params:
    - name: investmentId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "amount": 0,
        "description": "",
        "paidAt": "",
        "transactionReference": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
