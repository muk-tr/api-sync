info:
  name: Update loan product credit policies
  type: http
  seq: 1
  tags:
    - LoanProducts

http:
  method: PUT
  url: "{{baseUrl}}/v1/loan-products/:id/credit-policies"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "creditPolicyIds": []
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
