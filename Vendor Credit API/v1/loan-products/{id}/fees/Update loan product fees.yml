info:
  name: Update loan product fees
  type: http
  seq: 1
  tags:
    - LoanProducts

http:
  method: PUT
  url: "{{baseUrl}}/v1/loan-products/:id/fees"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      [
        {
          "name": "",
          "amount": 0,
          "feeType": "FlatFees"
        }
      ]
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
