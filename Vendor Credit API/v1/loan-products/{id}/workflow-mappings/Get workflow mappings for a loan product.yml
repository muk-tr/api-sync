info:
  name: Get workflow mappings for a loan product
  type: http
  seq: 1
  tags:
    - LoanProducts

http:
  method: GET
  url: "{{baseUrl}}/v1/loan-products/:id/workflow-mappings"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
