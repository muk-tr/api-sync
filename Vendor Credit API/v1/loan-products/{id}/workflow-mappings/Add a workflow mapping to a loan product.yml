info:
  name: Add a workflow mapping to a loan product
  type: http
  seq: 2
  tags:
    - LoanProducts

http:
  method: POST
  url: "{{baseUrl}}/v1/loan-products/:id/workflow-mappings"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "approvalWorkflowId": 0,
        "minAmount": 0,
        "maxAmount": 0,
        "isActive": false,
        "createdAt": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
