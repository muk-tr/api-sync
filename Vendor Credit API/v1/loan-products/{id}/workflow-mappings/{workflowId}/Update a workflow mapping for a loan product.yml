info:
  name: Update a workflow mapping for a loan product
  type: http
  seq: 1
  tags:
    - LoanProducts

http:
  method: PUT
  url: "{{baseUrl}}/v1/loan-products/:id/workflow-mappings/:workflowId"
  params:
    - name: id
      value: ""
      type: path
    - name: workflowId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "approvalWorkflowId": 0,
        "minAmount": 0,
        "maxAmount": 0,
        "isActive": false,
        "createdAt": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
