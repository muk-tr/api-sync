info:
  name: Update an existing loan product
  type: http
  seq: 2
  tags:
    - LoanProducts

http:
  method: PUT
  url: "{{baseUrl}}/v1/loan-products/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "minimumLoanTenor": 0,
        "maximumLoanTenor": 0,
        "hasMoratorium": false,
        "moratoriumPeriodInDays": 0,
        "minAmount": 0,
        "maxAmount": 0,
        "loanProductCategory": "Individual"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
