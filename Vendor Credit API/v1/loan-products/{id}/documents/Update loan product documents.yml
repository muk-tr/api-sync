info:
  name: Update loan product documents
  type: http
  seq: 1
  tags:
    - LoanProducts

http:
  method: PUT
  url: "{{baseUrl}}/v1/loan-products/:id/documents"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      [
        {
          "documentType": "CacRegistration",
          "description": ""
        }
      ]
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
