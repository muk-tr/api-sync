info:
  name: Verify a bank account number
  type: http
  seq: 1
  tags:
    - Banks

http:
  method: POST
  url: "{{baseUrl}}/v1/banks/verify-account"
  body:
    type: json
    data: |-
      {
        "bankCode": "",
        "accountNumber": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
