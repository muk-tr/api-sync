info:
  name: Extract and parse bank statement from URI
  type: http
  seq: 1
  tags:
    - BankStatementExtraction

http:
  method: POST
  url: "{{baseUrl}}/v1/bank-statement-extraction/extract"
  body:
    type: json
    data: |-
      {
        "uri": "",
        "loanRequestId": 0,
        "channel": "",
        "statementType": "Business"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
