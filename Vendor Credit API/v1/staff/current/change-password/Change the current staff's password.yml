info:
  name: Change the current staff's password
  type: http
  seq: 1
  tags:
    - Staff

http:
  method: POST
  url: "{{baseUrl}}/v1/staff/current/change-password"
  body:
    type: json
    data: |-
      {
        "newPassword": "",
        "confirmNewPassword": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
