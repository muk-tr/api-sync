info:
  name: Update the current staff's personal information
  type: http
  seq: 2
  tags:
    - Staff

http:
  method: PUT
  url: "{{baseUrl}}/v1/staff/current"
  body:
    type: json
    data: |-
      {
        "firstName": "",
        "lastName": "",
        "roleId": 0,
        "phoneNumber": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
