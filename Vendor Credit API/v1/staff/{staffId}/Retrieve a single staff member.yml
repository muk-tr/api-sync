info:
  name: Retrieve a single staff member
  type: http
  seq: 1
  tags:
    - Staff

http:
  method: GET
  url: "{{baseUrl}}/v1/staff/:staffId"
  params:
    - name: staffId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
