info:
  name: Force reset a staff member's account password
  type: http
  seq: 1
  tags:
    - Staff

http:
  method: POST
  url: "{{baseUrl}}/v1/staff/:staffId/force-password-reset"
  params:
    - name: staffId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
