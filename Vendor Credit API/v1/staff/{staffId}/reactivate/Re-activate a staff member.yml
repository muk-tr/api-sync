info:
  name: Re-activate a staff member
  type: http
  seq: 1
  tags:
    - Staff

http:
  method: POST
  url: "{{baseUrl}}/v1/staff/:staffId/reactivate"
  params:
    - name: staffId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
