info:
  name: Update a single staff member
  type: http
  seq: 2
  tags:
    - Staff

http:
  method: PUT
  url: "{{baseUrl}}/v1/staff/:staffId"
  params:
    - name: staffId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "roleId": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
