info:
  name: Get stored detailed PDF credit report by loan request ID
  type: http
  seq: 1
  tags:
    - CreditAnalysis

http:
  method: GET
  url: "{{baseUrl}}/v1/credit-analysis/detailed-credit-report/:loanRequestId"
  params:
    - name: loanRequestId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
