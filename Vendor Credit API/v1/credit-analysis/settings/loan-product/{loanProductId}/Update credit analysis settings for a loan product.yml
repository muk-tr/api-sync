info:
  name: Update credit analysis settings for a loan product
  type: http
  seq: 1
  tags:
    - CreditAnalysis

http:
  method: PUT
  url: "{{baseUrl}}/v1/credit-analysis/settings/loan-product/:loanProductId"
  params:
    - name: loanProductId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "isFccbAnalysisEnabled": false,
        "isMbsAnalysisEnabled": false,
        "isCrcAnalysisEnabled": false,
        "isInternalAnalysisEnabled": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
