info:
  name: Get comprehensive customer analysis summary
  type: http
  seq: 1
  tags:
    - CreditAnalysis

http:
  method: POST
  url: "{{baseUrl}}/v1/credit-analysis/customer-summary"
  body:
    type: json
    data: |-
      {
        "fullName": "",
        "bvn": "",
        "phoneNumber": "",
        "loanRequestId": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
