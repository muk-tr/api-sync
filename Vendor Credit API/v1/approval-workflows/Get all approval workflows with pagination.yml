info:
  name: Get all approval workflows with pagination
  type: http
  seq: 1
  tags:
    - ApprovalWorkflows

http:
  method: GET
  url: "{{baseUrl}}/v1/approval-workflows"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
