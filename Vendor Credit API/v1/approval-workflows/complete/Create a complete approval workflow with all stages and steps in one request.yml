info:
  name: Create a complete approval workflow with all stages and steps in one request
  type: http
  seq: 1
  tags:
    - ApprovalWorkflows

http:
  method: POST
  url: "{{baseUrl}}/v1/approval-workflows/complete"
  body:
    type: json
    data: |-
      {
        "name": "",
        "stages": [
          {
            "id": 0,
            "name": "",
            "steps": [
              {
                "id": 0,
                "name": "",
                "order": 0,
                "approvalType": "Staff",
                "configuration": {
                  "staffRole": "All",
                  "numberOfApprovalsRequired": 0,
                  "systemProcess": "",
                  "passCriteria": 0,
                  "pathId": 0
                }
              }
            ]
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
