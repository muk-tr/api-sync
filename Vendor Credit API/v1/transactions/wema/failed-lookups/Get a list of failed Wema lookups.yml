info:
  name: Get a list of failed Wema lookups
  type: http
  seq: 1
  tags:
    - Transactions

http:
  method: GET
  url: "{{baseUrl}}/v1/transactions/wema/failed-lookups"
  params:
    - name: TransactionType
      value: Inflow
      type: query
      disabled: true
    - name: TransactionType
      value: Outflow
      type: query
      disabled: true
    - name: Company
      value: ""
      type: query
      disabled: true
    - name: FromAmount
      value: ""
      type: query
      disabled: true
    - name: ToAmount
      value: ""
      type: query
      disabled: true
    - name: Status
      value: AwaitingApproval
      type: query
      disabled: true
    - name: Status
      value: Successful
      type: query
      disabled: true
    - name: Status
      value: Failed
      type: query
      disabled: true
    - name: Status
      value: Pending
      type: query
      disabled: true
    - name: TransactionProvider
      value: Wema
      type: query
      disabled: true
    - name: TransactionProvider
      value: Flutterwave
      type: query
      disabled: true
    - name: TransactionProvider
      value: Keystone
      type: query
      disabled: true
    - name: TransactionProvider
      value: Access
      type: query
      disabled: true
    - name: StartAt
      value: ""
      type: query
      disabled: true
    - name: EndAt
      value: ""
      type: query
      disabled: true
    - name: Search
      value: ""
      type: query
      disabled: true
    - name: Page
      value: ""
      type: query
      disabled: true
    - name: PageSize
      value: ""
      type: query
      disabled: true
    - name: Sort.Order_By
      value: ""
      type: query
      disabled: true
    - name: Sort.Sort_By
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
