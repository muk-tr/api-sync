info:
  name: Retrieve an asset
  type: http
  seq: 1
  tags:
    - Assets

http:
  method: GET
  url: "{{baseUrl}}/v1/assets"
  params:
    - name: assetId
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
