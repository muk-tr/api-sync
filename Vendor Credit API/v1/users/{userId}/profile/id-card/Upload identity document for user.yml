info:
  name: Upload identity document for user
  type: http
  seq: 1
  tags:
    - Users

http:
  method: POST
  url: "{{baseUrl}}/v1/users/:userId/profile/id-card"
  params:
    - name: userId
      value: ""
      type: path
  body:
    type: multipart-form
    data:
      - name: File
        type: file
        value: []
      - name: Number
        type: text
        value: ""
      - name: IdentityCardType
        type: text
        value: ""
      - name: IdentityCardExpiry
        type: text
        value: ""
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
