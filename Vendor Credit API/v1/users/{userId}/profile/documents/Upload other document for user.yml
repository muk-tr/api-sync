info:
  name: Upload other document for user
  type: http
  seq: 1
  tags:
    - Users

http:
  method: POST
  url: "{{baseUrl}}/v1/users/:userId/profile/documents"
  params:
    - name: userId
      value: ""
      type: path
  body:
    type: multipart-form
    data:
      - name: Type
        type: text
        value: ""
      - name: File
        type: file
        value: []
      - name: SubType
        type: text
        value: ""
      - name: ExpiresAt
        type: text
        value: ""
      - name: DocumentNumber
        type: text
        value: ""
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
