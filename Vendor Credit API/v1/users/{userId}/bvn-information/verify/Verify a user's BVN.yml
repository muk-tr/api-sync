info:
  name: Verify a user's BVN
  type: http
  seq: 1
  tags:
    - Users

http:
  method: POST
  url: "{{baseUrl}}/v1/users/:userId/bvn-information/verify"
  params:
    - name: userId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
