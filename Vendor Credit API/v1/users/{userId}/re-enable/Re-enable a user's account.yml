info:
  name: Re-enable a user's account
  type: http
  seq: 1
  tags:
    - Users

http:
  method: PATCH
  url: "{{baseUrl}}/v1/users/:userId/re-enable"
  params:
    - name: userId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
