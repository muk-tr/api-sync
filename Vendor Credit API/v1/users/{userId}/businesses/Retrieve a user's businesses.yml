info:
  name: Retrieve a user's businesses
  type: http
  seq: 1
  tags:
    - Users

http:
  method: GET
  url: "{{baseUrl}}/v1/users/:userId/businesses"
  params:
    - name: userId
      value: ""
      type: path
    - name: activeOnly
      value: "true"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
