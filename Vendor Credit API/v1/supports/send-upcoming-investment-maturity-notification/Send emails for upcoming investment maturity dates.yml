info:
  name: Send emails for upcoming investment maturity dates
  type: http
  seq: 1
  tags:
    - Supports

http:
  method: POST
  url: "{{baseUrl}}/v1/supports/send-upcoming-investment-maturity-notification"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
