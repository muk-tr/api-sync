info:
  name: Retrieve caller's transfer recipient
  type: http
  seq: 1
  tags:
    - TransferRecipients

http:
  method: GET
  url: "{{baseUrl}}/v1/transfer-recipients/:transferRecipientId/user/:userId"
  params:
    - name: transferRecipientId
      value: ""
      type: path
    - name: userId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
