info:
  name: Remove a transfer recipient from the callers account
  type: http
  seq: 1
  tags:
    - TransferRecipients

http:
  method: DELETE
  url: "{{baseUrl}}/v1/transfer-recipients/:recipientId"
  params:
    - name: recipientId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
