info:
  name: Verify a corporate profile
  type: http
  seq: 1
  tags:
    - CorporateProfiles

http:
  method: POST
  url: "{{baseUrl}}/v1/corporate-profiles/:id/verify"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
