info:
  name: Add a document to a corporate profile
  type: http
  seq: 2
  tags:
    - CorporateProfiles

http:
  method: POST
  url: "{{baseUrl}}/v1/corporate-profiles/:id/documents"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: multipart-form
    data:
      - name: File
        type: file
        value: []
      - name: DocumentType
        type: text
        value: ""
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
