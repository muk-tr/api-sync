info:
  name: Get documents associated with a corporate profile
  type: http
  seq: 1
  tags:
    - CorporateProfiles

http:
  method: GET
  url: "{{baseUrl}}/v1/corporate-profiles/:id/documents"
  params:
    - name: id
      value: ""
      type: path
    - name: Search
      value: ""
      type: query
      disabled: true
    - name: Page
      value: ""
      type: query
      disabled: true
    - name: PageSize
      value: ""
      type: query
      disabled: true
    - name: Sort.Order_By
      value: ""
      type: query
      disabled: true
    - name: Sort.Sort_By
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
