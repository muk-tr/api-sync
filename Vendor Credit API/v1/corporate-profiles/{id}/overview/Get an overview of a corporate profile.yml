info:
  name: Get an overview of a corporate profile
  type: http
  seq: 1
  tags:
    - CorporateProfiles

http:
  method: GET
  url: "{{baseUrl}}/v1/corporate-profiles/:id/overview"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
