info:
  name: Update an existing corporate profile
  type: http
  seq: 1
  tags:
    - CorporateProfiles

http:
  method: PUT
  url: "{{baseUrl}}/v1/corporate-profiles/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: multipart-form
    data:
      - name: ContactEmailAddress
        type: text
        value: ""
      - name: ContactPhoneNumber
        type: text
        value: ""
      - name: Industry
        type: text
        value: ""
      - name: State
        type: text
        value: ""
      - name: City
        type: text
        value: ""
      - name: BusinessAddress
        type: text
        value: ""
      - name: Logo
        type: file
        value: []
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
