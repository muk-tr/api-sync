info:
  name: Create a new corporate profile
  type: http
  seq: 1
  tags:
    - CorporateProfiles

http:
  method: POST
  url: "{{baseUrl}}/v1/corporate-profiles"
  body:
    type: multipart-form
    data:
      - name: CorporateName
        type: text
        value: ""
      - name: ContactEmailAddress
        type: text
        value: ""
      - name: ContactPhoneNumber
        type: text
        value: ""
      - name: Industry
        type: text
        value: ""
      - name: State
        type: text
        value: ""
      - name: City
        type: text
        value: ""
      - name: BusinessAddress
        type: text
        value: ""
      - name: Logo
        type: file
        value: []
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
