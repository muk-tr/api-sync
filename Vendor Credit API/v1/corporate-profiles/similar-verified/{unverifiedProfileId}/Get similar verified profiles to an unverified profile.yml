info:
  name: Get similar verified profiles to an unverified profile
  type: http
  seq: 1
  tags:
    - CorporateProfiles

http:
  method: GET
  url: "{{baseUrl}}/v1/corporate-profiles/similar-verified/:unverifiedProfileId"
  params:
    - name: unverifiedProfileId
      value: ""
      type: path
    - name: similarityThreshold
      value: "70"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
