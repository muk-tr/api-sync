info:
  name: Setup multi-factor authentication for a staff account
  type: http
  seq: 1
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/mfa/setup"
  body:
    type: json
    data: |-
      {
        "type": "AuthenticatorApp"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
