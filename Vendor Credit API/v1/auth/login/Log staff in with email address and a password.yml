info:
  name: Log staff in with email address and a password
  type: http
  seq: 1
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/login"
  body:
    type: json
    data: |-
      { "emailAddress" : "{{email}}",
        "password": "{{pass}}",
        "otpCode": "{{otpCode}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Pure JS TOTP — no require() needed
        function sha1(bytes) {
          let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
          const ml = bytes.length;
          const blocks = ((ml + 8) >> 6) + 1;
          const M = new Int32Array(blocks * 16);
          for (let i = 0; i < ml; i++) M[i >> 2] |= bytes[i] << (24 - (i & 3) * 8);
          M[ml >> 2] |= 0x80 << (24 - (ml & 3) * 8);
          M[blocks * 16 - 1] = ml * 8;
          for (let b = 0; b < blocks; b++) {
            const W = Array.from(M.slice(b * 16, (b + 1) * 16));
            for (let i = 16; i < 80; i++) {
              const x = W[i-3] ^ W[i-8] ^ W[i-14] ^ W[i-16];
              W[i] = ((x << 1) | (x >>> 31)) | 0;
            }
            let a = h0, bb = h1, c = h2, d = h3, e = h4;
            for (let i = 0; i < 80; i++) {
              let f, k;
              if (i < 20)      { f = (bb & c) | (~bb & d); k = 0x5A827999; }
              else if (i < 40) { f = bb ^ c ^ d;            k = 0x6ED9EBA1; }
              else if (i < 60) { f = (bb & c) | (bb & d) | (c & d); k = 0x8F1BBCDC; }
              else             { f = bb ^ c ^ d;            k = 0xCA62C1D6; }
              const t = (((a << 5) | (a >>> 27)) + f + e + k + W[i]) | 0;
              e = d; d = c; c = ((bb << 30) | (bb >>> 2)) | 0; bb = a; a = t;
            }
            h0 = (h0 + a) | 0; h1 = (h1 + bb) | 0; h2 = (h2 + c) | 0;
            h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
          }
          const out = new Uint8Array(20);
          [h0, h1, h2, h3, h4].forEach((h, i) => {
            out[i*4] = (h >>> 24) & 0xff; out[i*4+1] = (h >>> 16) & 0xff;
            out[i*4+2] = (h >>> 8) & 0xff; out[i*4+3] = h & 0xff;
          });
          return out;
        }

        function hmacSha1(key, msg) {
          if (key.length > 64) key = sha1(key);
          const k = new Uint8Array(64);
          k.set(key);
          const inner = new Uint8Array(64 + msg.length);
          const outer = new Uint8Array(84);
          for (let i = 0; i < 64; i++) { inner[i] = k[i] ^ 0x36; outer[i] = k[i] ^ 0x5c; }
          inner.set(msg, 64);
          outer.set(sha1(inner), 64);
          return sha1(outer);
        }

        function base32Decode(s) {
          const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
          s = s.replace(/=+$/, '').toUpperCase();
          let bits = 0, val = 0;
          const out = [];
          for (const c of s) {
            const i = alpha.indexOf(c);
            if (i < 0) continue;
            val = (val << 5) | i;
            bits += 5;
            if (bits >= 8) { out.push((val >>> (bits - 8)) & 0xff); bits -= 8; }
          }
          return new Uint8Array(out);
        }

        function totp(secret, digits = 6, period = 30) {
          const key = base32Decode(secret);
          const step = Math.floor(Date.now() / 1000 / period);
          const buf = new Uint8Array(8);
          let t = step;
          for (let i = 7; i >= 0; i--) { buf[i] = t & 0xff; t = Math.floor(t / 256); }
          const hash = hmacSha1(key, buf);
          const off = hash[19] & 0x0f;
          const code = (((hash[off] & 0x7f) << 24) | (hash[off+1] << 16) | (hash[off+2] << 8) | hash[off+3]) % (10 ** digits);
          return String(code).padStart(digits, '0');
        }

        const secret = bru.getEnvVar('secret') || bru.getVar('secret');
        if (!secret) {
          console.error('[login] Pre-Request: "secret" is not set in env or collection vars — cannot compute OTP');
        } else {
          const otp = totp(secret);
          bru.setVar('otpCode', otp);
          console.log('[login] Pre-Request: OTP computed and set →', otp);
        }
    - type: after-response
      code: |-
        console.log('[login] Post-Response: status', res.status);
        const token = res.body && res.body.token;
        if (token) {
          bru.setEnvVar('token', token);
          console.log('[login] Post-Response: token saved to env ✓');
        } else {
          console.warn('[login] Post-Response: no token in response body —', JSON.stringify(res.body));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
