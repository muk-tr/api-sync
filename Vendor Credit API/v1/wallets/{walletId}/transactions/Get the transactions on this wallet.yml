info:
  name: Get the transactions on this wallet
  type: http
  seq: 1
  tags:
    - Wallets

http:
  method: GET
  url: "{{baseUrl}}/v1/wallets/:walletId/transactions"
  params:
    - name: walletId
      value: ""
      type: path
    - name: search
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
