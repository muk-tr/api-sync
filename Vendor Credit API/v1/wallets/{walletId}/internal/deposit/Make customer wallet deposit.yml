info:
  name: Make customer wallet deposit
  type: http
  seq: 1
  tags:
    - Wallets

http:
  method: POST
  url: "{{baseUrl}}/v1/wallets/:walletId/internal/deposit"
  params:
    - name: walletId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "amount": 0,
        "narration": "",
        "sourceAccount": "",
        "paidAt": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
