info:
  name: Create a wallet for a user
  type: http
  seq: 1
  tags:
    - Wallets

http:
  method: POST
  url: "{{baseUrl}}/v1/wallets/generate/user/:provider"
  params:
    - name: provider
      value: Wema
      type: path
    - name: provider
      value: Flutterwave
      type: path
      disabled: true
    - name: provider
      value: Keystone
      type: path
      disabled: true
    - name: provider
      value: Access
      type: path
      disabled: true
  body:
    type: json
    data: |-
      {
        "userId": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
