info:
  name: Wema block wallet account endpoint
  type: http
  seq: 1
  tags:
    - Wallets

http:
  method: POST
  url: "{{baseUrl}}/v1/wallets/blockaccount"
  body:
    type: json
    data: |-
      {
        "accountnumber": "",
        "blockreason": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
