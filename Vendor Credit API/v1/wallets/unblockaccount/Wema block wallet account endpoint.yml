info:
  name: Wema block wallet account endpoint
  type: http
  seq: 1
  tags:
    - Wallets

http:
  method: GET
  url: "{{baseUrl}}/v1/wallets/unblockaccount"
  params:
    - name: accountNumber
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
