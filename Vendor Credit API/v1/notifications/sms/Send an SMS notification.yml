info:
  name: Send an SMS notification
  type: http
  seq: 1
  tags:
    - Notifications

http:
  method: POST
  url: "{{baseUrl}}/v1/notifications/sms"
  body:
    type: json
    data: |-
      {
        "recipientPhoneNumber": "07038564466",
        "body": "I am testing the "
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
