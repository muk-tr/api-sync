info:
  name: Send an Email notification
  type: http
  seq: 1
  tags:
    - Notifications

http:
  method: POST
  url: "{{baseUrl}}/v1/notifications/email"
  body:
    type: json
    data: |-
      {
        "recipientEmailAddress": "danielmomodu@yopmail.com",
        "subject": "WE are in Business",
        "body": "Testing ultimate 23456789dfghjk"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
