info:
  name: verify document for business
  type: http
  seq: 1
  tags:
    - Businesses

http:
  method: POST
  url: "{{baseUrl}}/v1/businesses/:businessId/documents/verify"
  params:
    - name: businessId
      value: ""
      type: path
  body:
    type: multipart-form
    data:
      - name: Type
        type: text
        value: ""
      - name: IsVerified
        type: text
        value: ""
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
