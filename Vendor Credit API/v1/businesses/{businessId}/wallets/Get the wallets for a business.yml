info:
  name: Get the wallets for a business
  type: http
  seq: 1
  tags:
    - Businesses

http:
  method: GET
  url: "{{baseUrl}}/v1/businesses/:businessId/wallets"
  params:
    - name: businessId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
