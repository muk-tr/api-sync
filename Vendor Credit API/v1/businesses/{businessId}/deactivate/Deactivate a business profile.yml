info:
  name: Deactivate a business profile
  type: http
  seq: 1
  tags:
    - Businesses

http:
  method: POST
  url: "{{baseUrl}}/v1/businesses/:businessId/deactivate"
  params:
    - name: businessId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "reason": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
