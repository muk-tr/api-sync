info:
  name: Update a business profile's logo
  type: http
  seq: 1
  tags:
    - Businesses

http:
  method: POST
  url: "{{baseUrl}}/v1/businesses/:businessId/logo"
  params:
    - name: businessId
      value: ""
      type: path
  body:
    type: multipart-form
    data:
      - name: File
        type: file
        value: []
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
