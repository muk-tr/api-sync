      - name: ManagingCustomerId
        type: text
        value: ""
      - name: BusinessName
        type: text
        value: ""
      - name: Type
        type: text
        value: ""
      - name: RcNumber
        type: text
        value: ""
      - name: DateOfInc
        type: text
        value: ""
      - name: Platforms
        type: text
        value: ""
      - name: Industry
        type: text
        value: ""
      - name: TaxIdentificationNumber
        type: text
        value: ""
      - name: OtherIndustryType
        type: text
        value: ""
      - name: BusinessEmailAddress
        type: text
        value: ""
      - name: BusinessPhoneNumber
        type: text
        value: ""
      - name: BusinessCountryCode
        type: text
        value: ""
      - name: State
        type: text
        value: ""
      - name: City
        type: text
        value: ""
      - name: StreetAddress
        type: text
        value: ""
      - name: OwnerOrDirectorId
        type: text
        value: ""
      - name: OwnerOrDirectorFullName
        type: text
        value: ""
      - name: OwnerOrDirectorPhoneNumber
        type: text
        value: ""
