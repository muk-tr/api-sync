        value: ""
      - name: OwnerNextOfKinFullName
        type: text
        value: ""
      - name: OwnerNextOfKinPhoneNumber
        type: text
        value: ""
      - name: OwnerNextOfKinCountryCode
        type: text
        value: ""
      - name: SecondDirectorsFullName
        type: text
        value: ""
      - name: SecondDirectorsPhoneNumber
        type: text
        value: ""
      - name: SecondDirectorsCountryCode
        type: text
        value: ""
      - name: SecondDirectorsEmailAddress
        type: text
        value: ""
      - name: SecondDirectorsBankVerificationNumber
        type: text
        value: ""
      - name: SecondDirectorsNextOfKinFullName
        type: text
        value: ""
      - name: SecondDirectorsNextOfKinPhoneNumber
        type: text
        value: ""
      - name: SecondDirectorsNextOfKinCountryCode
        type: text
        value: ""
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
