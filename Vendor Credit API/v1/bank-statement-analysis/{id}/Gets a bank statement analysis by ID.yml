info:
  name: Gets a bank statement analysis by ID
  type: http
  seq: 1
  tags:
    - BankStatementAnalysis

http:
  method: GET
  url: "{{baseUrl}}/v1/bank-statement-analysis/:id"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
