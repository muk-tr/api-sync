info:
  name: Gets all bank statement analyses with pagination
  type: http
  seq: 1
  tags:
    - BankStatementAnalysis

http:
  method: GET
  url: "{{baseUrl}}/v1/bank-statement-analysis"
  params:
    - name: page
      value: "1"
      type: query
    - name: itemPerPage
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
