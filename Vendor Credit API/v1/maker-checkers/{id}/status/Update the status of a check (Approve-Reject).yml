info:
  name: Update the status of a check (Approve/Reject)
  type: http
  seq: 1
  tags:
    - MakerChecker

http:
  method: POST
  url: "{{baseUrl}}/v1/maker-checkers/:id/status"
  params:
    - name: id
      value: "60"
      type: path
  body:
    type: json
    data: |-
      {
        "status": "Approve",
        "comments": "Test"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
