info:
  name: Request deletion of a document belonging to a loan request (portal staff only).
  type: http
  seq: 1
  tags:
    - LoanRequests

http:
  method: POST
  url: "{{baseUrl}}/v1/loan-requests/:loanRequestId/documents/:documentId/request-deletion"
  params:
    - name: loanRequestId
      value: ""
      type: path
    - name: documentId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "reason": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
