info:
  name: Retrieve a loan request's documents
  type: http
  seq: 1
  tags:
    - LoanRequests

http:
  method: GET
  url: "{{baseUrl}}/v1/loan-requests/:loanRequestId/documents"
  params:
    - name: loanRequestId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
