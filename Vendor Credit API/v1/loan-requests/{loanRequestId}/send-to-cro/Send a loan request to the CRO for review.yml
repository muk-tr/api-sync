info:
  name: Send a loan request to the CRO for review
  type: http
  seq: 1
  tags:
    - LoanRequests

http:
  method: POST
  url: "{{baseUrl}}/v1/loan-requests/:loanRequestId/send-to-cro"
  params:
    - name: loanRequestId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
