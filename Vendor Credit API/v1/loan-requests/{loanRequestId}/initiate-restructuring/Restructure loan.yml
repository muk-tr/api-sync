info:
  name: Restructure loan
  type: http
  seq: 1
  tags:
    - LoanRequests

http:
  method: PUT
  url: "{{baseUrl}}/v1/loan-requests/:loanRequestId/initiate-restructuring"
  params:
    - name: loanRequestId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "accountRepId": 0,
        "loanAmount": 0,
        "tenorInDays": 0,
        "processingFeeRate": 0,
        "interestRate": 0,
        "interestType": "Prorated",
        "defaultFeeRate": 0,
        "extensionFeeRate": 0,
        "chargeDefaultFee": false,
        "vatRate": 0,
        "insuranceIsPaidUpfront": false,
        "insuranceFeeRate": 0,
        "transactionFee": 0,
        "verificationFee": 0,
        "verificationIsPaidUpfront": false,
        "equityContribution": 0,
        "otherConditions": "",
        "proRataPeriod": "NotApplicable",
        "invoiceSubmissionDate": "",
        "repaymentFrequency": "OneOff",
        "collateral": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
