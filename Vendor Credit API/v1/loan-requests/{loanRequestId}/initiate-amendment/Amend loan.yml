info:
  name: Amend loan
  type: http
  seq: 1
  tags:
    - LoanRequests

http:
  method: PUT
  url: "{{baseUrl}}/v1/loan-requests/:loanRequestId/initiate-amendment"
  params:
    - name: loanRequestId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "id": 0,
        "accountRepId": 0,
        "interestRate": 0,
        "defaultFeeRate": 0,
        "extensionFeeRate": 0,
        "chargeDefaultFee": false,
        "comment": "",
        "collateral": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
