info:
  name: Get a repayment history
  type: http
  seq: 1
  tags:
    - LoanRequests

http:
  method: POST
  url: "{{baseUrl}}/v1/loan-requests/:loanRequestId/get-repayment-history"
  params:
    - name: loanRequestId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "averageDaysInArrears": 0,
        "creditMix": 0,
        "numberOfPaidOffTransactions": 0,
        "durationWithVC": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
