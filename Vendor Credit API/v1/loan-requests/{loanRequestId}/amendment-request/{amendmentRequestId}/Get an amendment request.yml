info:
  name: Get an amendment request
  type: http
  seq: 1
  tags:
    - LoanRequests

http:
  method: POST
  url: "{{baseUrl}}/v1/loan-requests/:loanRequestId/amendment-request/:amendmentRequestId"
  params:
    - name: loanRequestId
      value: ""
      type: path
    - name: amendmentRequestId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
