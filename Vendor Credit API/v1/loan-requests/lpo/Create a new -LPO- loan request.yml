info:
  name: Create a new "LPO" loan request
  type: http
  seq: 1
  tags:
    - LoanRequests

http:
  method: POST
  url: "{{baseUrl}}/v1/loan-requests/lpo"
  body:
    type: json
    data: |-
      {
        "userId": 0,
        "businessId": 0,
        "counterPartyName": "",
        "counterPartyEmail": "",
        "invoiceSubmissionDate": "",
        "contractValue": 0,
        "executionCost": 0,
        "poNumber": "",
        "issuedAt": "",
        "expiresAt": "",
        "loanAmount": 0,
        "tenorInDays": 0,
        "sourceLoanRequestId": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
