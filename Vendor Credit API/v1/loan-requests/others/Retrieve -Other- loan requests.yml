info:
  name: Retrieve "Other" loan requests
  type: http
  seq: 1
  tags:
    - LoanRequests

http:
  method: GET
  url: "{{baseUrl}}/v1/loan-requests/others"
  params:
    - name: LoanStatus
      value: AwaitingDisbursement
      type: query
      disabled: true
    - name: LoanStatus
      value: Active
      type: query
      disabled: true
    - name: LoanStatus
      value: Repaid
      type: query
      disabled: true
    - name: LoanStatus
      value: PastDue
      type: query
      disabled: true
    - name: LoanStatus
      value: Lost
      type: query
      disabled: true
    - name: LoanStatus
      value: Restructured
      type: query
      disabled: true
    - name: LoanStatus
      value: Cancelled
      type: query
      disabled: true
    - name: LoanStatus
      value: Missed
      type: query
      disabled: true
    - name: CustomerId
      value: ""
      type: query
      disabled: true
    - name: CompanyId
      value: ""
      type: query
      disabled: true
    - name: CreatedStartAt
      value: ""
      type: query
      disabled: true
    - name: CreatedEndAt
      value: ""
      type: query
      disabled: true
    - name: Search
      value: ""
      type: query
      disabled: true
    - name: Page
      value: ""
      type: query
      disabled: true
    - name: PageSize
      value: ""
      type: query
      disabled: true
    - name: Sort.Order_By
      value: ""
      type: query
      disabled: true
    - name: Sort.Sort_By
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
