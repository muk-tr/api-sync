info:
  name: Get a bank statement analysis policy result
  type: http
  seq: 1
  tags:
    - LoanAppraisals

http:
  method: GET
  url: "{{baseUrl}}/v1/loan-appraisals/:externalId/bank-statement-analysis"
  params:
    - name: externalId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
