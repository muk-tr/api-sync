info:
  name: Create a new loan appraisal record and initiates background processing.
  type: http
  seq: 1
  tags:
    - LoanAppraisals

http:
  method: POST
  url: "{{baseUrl}}/v1/loan-appraisals"
  body:
    type: json
    data: |-
      {
        "externalId": "",
        "source": "VcPortal"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
